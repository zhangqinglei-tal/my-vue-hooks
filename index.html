<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-vue-hooks 开发演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    
    #app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    header {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }
    
    .subtitle {
      color: #7f8c8d;
      font-size: 1rem;
    }
    
    .demo-section {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    
    .demo-section h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 0.5rem;
    }
    
    .demo-content {
      margin-top: 1rem;
    }
    
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #2980b9;
    }
    
    button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }
    
    .result {
      margin-top: 1rem;
      padding: 1rem;
      background: #ecf0f1;
      border-radius: 4px;
      border-left: 4px solid #3498db;
    }
    
    .result pre {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      margin-top: 0.5rem;
    }
    
    .error {
      border-left-color: #e74c3c;
      background: #fee;
    }
    
    .success {
      border-left-color: #27ae60;
      background: #efe;
    }
    
    .loading {
      color: #3498db;
      font-style: italic;
    }
    
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #ecf0f1;
    }
    
    .tab {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: #7f8c8d;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    
    .tab.active {
      color: #3498db;
      border-bottom-color: #3498db;
    }
    
    .tab:hover {
      color: #3498db;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/dev/main.ts"></script>
</body>
</html>
